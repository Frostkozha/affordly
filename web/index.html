<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='5' y='26' font-family='Georgia' font-size='30'%3EA%3C/text%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Plan the week you can actually afford. Affordly prices whole grocery packages and carries leftovers into next week." />
    <meta name="theme-color" content="#f3eadb" />
    <script>
      try {
        var saved = localStorage.getItem('affordly-theme');
        var root = document.documentElement;
        if (saved === 'light' || saved === 'dark') root.dataset.theme = saved;
        var night = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.querySelector('meta[name="theme-color"]').content = night ? '#161616' : '#f3eadb';
      } catch (e) { /* Device setting applies. */ }
    </script>
    <title>Affordly — plan the week you can actually afford</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
